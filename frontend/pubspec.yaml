name: frontend
description: "FolioSpace — portofolio interaktif multitenant (Flutter Web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  go_router: ^18.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3
  json_annotation: ^4.12.0
  flutter_dotenv: ^6.0.1
  file_picker: ^8.1.2
  skeletonizer: ^3.0.0
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  syncfusion_flutter_datepicker: ^35.1.41
  syncfusion_localizations: ^35.1.41
  dropdown_button2: ^3.1.0
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.16.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  # `.env` WAJIB terdaftar di sini: flutter_dotenv membaca file lewat
  # `rootBundle`, yang hanya bisa mengakses asset yang dideklarasikan.
  # File ini di-gitignore (lihat .gitignore root), jadi CI membuatnya lebih
  # dulu di langkah "Create .env" (.github/workflows/ci.yml). Tanpa file itu,
  # `flutter analyze`/`flutter build` gagal dengan `asset_does_not_exist`.
  assets:
    - .env
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
